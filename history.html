<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SM9 CBT • History</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/x-icon" href="fav.ico">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth-guard.js"></script>
</head>
<body>
  <nav class="top-nav">
    <div class="nav-left">
      <div class="brand">
        <span class="brand-mark">SM9</span>
        <span class="brand-text">CBT Platform</span>
      </div>
    </div>
    <div class="nav-right">
      <button onclick="window.location.href='dashboard.html'" class="btn btn-ghost">← Dashboard</button>
      <button id="logout-btn" class="btn btn-ghost">Logout</button>
    </div>
  </nav>

  <div class="dashboard-container">
    <h1 style="margin-bottom: 8px;">Test History</h1>
    <p style="color:#64748b; margin-bottom:32px;">All your completed examinations</p>

    <div id="history-list" class="recent-list">
      <!-- Populated by JS -->
    </div>
  </div>

  <script>
    (async function() {
      const supabase = window.SM9Supabase.getClient();
      const user = window.SM9User;
      const container = document.getElementById("history-list");

      if (!user) {
        window.location.href = "index.html";
        return;
      }

      try {
        const { data: attempts, error } = await supabase
          .from("attempts")
          .select("id, score, max_score, ended_at, papers(title)")
          .eq("user_id", user.id)
          .order("ended_at", { ascending: false });

        if (error) throw error;

        if (!attempts || attempts.length === 0) {
          container.innerHTML = `<div class="empty-state">No test history found.</div>`;
          return;
        }

        container.innerHTML = attempts.map(a => {
          const pct = Math.round((a.score / a.max_score) * 100);
          const date = new Date(a.ended_at).toLocaleDateString();
          return `
            <div class="recent-item">
              <div>
                <strong>${a.papers?.title || "Unknown Paper"}</strong><br>
                <span style="font-size:13px;color:#64748b">${date}</span>
              </div>
              <div style="text-align:right">
                <div style="font-weight:700">${a.score}/${a.max_score} <span style="font-size:13px">(${pct}%)</span></div>
              </div>
            </div>
          `;
        }).join("");

      } catch (err) {
        container.innerHTML = `<div class="empty-state">Failed to load history.</div>`;
      }

      document.getElementById("logout-btn").onclick = async () => {
        await supabase.auth.signOut();
        localStorage.removeItem("sm9_device_token");
        localStorage.removeItem("sm9_user");
        window.location.href = "index.html";
      };
    })();
  </script>
</body>
</html>
