<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SM9 CBT • Login</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet" />
  <link rel="icon" type="image/x-icon" href="fav.ico">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <!-- Brand Header -->
      <div class="login-brand">
        <div class="brand-mark">SM9</div>
        <div>
          <h1>CBT Platform</h1>
          <p class="brand-sub">Secure Computer Based Testing</p>
        </div>
      </div>

      <div class="login-header">
        <h2>Welcome Back</h2>
        <p>Sign in to access your tests and dashboard</p>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="login-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            placeholder="you@example.com" 
            required 
            autocomplete="username"
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            placeholder="••••••••" 
            required 
            autocomplete="current-password"
          />
        </div>

        <div id="login-error" class="error-msg" hidden></div>

        <button type="submit" class="btn btn-primary btn-block" id="login-btn">
          <span id="login-text">Sign In</span>
          <span id="login-spinner" class="spinner" hidden></span>
        </button>
      </form>

      <div class="login-footer">
        <p class="muted">Only authorized users can access this platform.</p>
        <p class="tiny">Contact your administrator for access.</p>
      </div>
    </div>

    <div class="login-security-note">
      <div class="security-badge">
        🔒 Single Device Login Enforced
      </div>
    </div>
  </div>

  <script>
    // Login Page Logic
    (function() {
      const form = document.getElementById("login-form");
      const errorEl = document.getElementById("login-error");
      const btn = document.getElementById("login-btn");
      const btnText = document.getElementById("login-text");
      const spinner = document.getElementById("login-spinner");

      function showError(msg) {
        errorEl.textContent = msg;
        errorEl.hidden = false;
      }

      function hideError() {
        errorEl.hidden = true;
      }

      function setLoading(isLoading) {
        btn.disabled = isLoading;
        if (isLoading) {
          btnText.textContent = "Signing in...";
          spinner.hidden = false;
        } else {
          btnText.textContent = "Sign In";
          spinner.hidden = true;
        }
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        hideError();
        setLoading(true);

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const supabase = window.SM9Supabase.getClient();

        try {
          // 1. Sign in with Supabase
          const { data: authData, error: authError } = await supabase.auth.signInWithPassword({
            email,
            password
          });

          if (authError) {
            throw new Error(authError.message || "Invalid credentials");
          }

          const userId = authData.user.id;

          // 2. Fetch profile
          const { data: profile, error: profileError } = await supabase
            .from("profiles")
            .select("id, role, active_device_token, full_name")
            .eq("id", userId)
            .single();

          if (profileError || !profile) {
            throw new Error("Your account is not yet activated. Please contact admin.");
          }

          // 3. Generate new device token (single device enforcement)
          const newDeviceToken = crypto.randomUUID();

          // 4. Update profile with new device token
          const { error: updateError } = await supabase
            .from("profiles")
            .update({
              active_device_token: newDeviceToken,
              last_login_at: new Date().toISOString()
            })
            .eq("id", userId);

          if (updateError) {
            console.warn("Could not update device token:", updateError);
          }

          // 5. Store device token locally (critical for auth-guard)
          localStorage.setItem("sm9_device_token", newDeviceToken);
          localStorage.setItem("sm9_user", JSON.stringify({
            id: profile.id,
            full_name: profile.full_name,
            role: profile.role
          }));

          // 6. Redirect based on role
          if (profile.role === "admin") {
            window.location.href = "admin.html";
          } else {
            window.location.href = "dashboard.html";
          }

        } catch (err) {
          console.error("Login failed:", err);
          showError(err.message || "Login failed. Please check your credentials.");
          setLoading(false);
        }
      });

      // Auto-focus email field
      document.getElementById("email").focus();
    })();
  </script>
</body>
</html>
