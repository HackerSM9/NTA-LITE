<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SM9 CBT • Admin Panel</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="icon" type="image/x-icon" href="fav.ico">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth-guard.js"></script>
</head>
<body>
  <nav class="top-nav">
    <div class="nav-left">
      <div class="brand">
        <span class="brand-mark">SM9</span>
        <span class="brand-text">Admin Panel</span>
      </div>
    </div>
    <div class="nav-right">
      <span id="admin-name"></span>
      <button id="logout-btn" class="btn btn-ghost">Logout</button>
    </div>
  </nav>

  <div class="dashboard-container">
    <h1>Admin Dashboard</h1>
    <p style="color:#64748b; margin-bottom: 40px;">Manage users and exam papers</p>

    <!-- Create New User -->
    <div class="admin-section">
      <h2>Create New User</h2>
      <div class="admin-card">
        <form id="create-user-form">
          <div class="form-row">
            <div class="form-group">
              <label>Email</label>
              <input type="email" id="new-email" placeholder="user@example.com" required>
            </div>
            <div class="form-group">
              <label>Full Name</label>
              <input type="text" id="new-name" placeholder="John Doe" required>
            </div>
            <div class="form-group">
              <label>Password</label>
              <input type="password" id="new-password" placeholder="Strong password" required>
            </div>
          </div>
          <button type="submit" class="btn btn-primary">Create User</button>
        </form>
        <div id="user-msg" class="msg" hidden></div>
      </div>
    </div>

    <!-- Upload Paper -->
    <div class="admin-section">
      <h2>Upload New Paper (JSON)</h2>
      <div class="admin-card">
        <form id="upload-paper-form">
          <div class="form-group">
            <label>Paper Title</label>
            <input type="text" id="paper-title" placeholder="JEE Main 2026 - Demo" required>
          </div>
          <div class="form-group">
            <label>Exam ID</label>
            <input type="text" id="exam-id" placeholder="4050367_B PLANNING">
          </div>
          <div class="form-group">
            <label>Duration (minutes)</label>
            <input type="number" id="duration" value="180" required>
          </div>
          <div class="form-group">
            <label>Paper JSON</label>
            <textarea id="paper-json" rows="8" placeholder='{"schemaVersion":"1.0", ...}' required></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Upload Paper</button>
        </form>
        <div id="paper-msg" class="msg" hidden></div>
      </div>
    </div>

    <!-- All Users -->
    <div class="admin-section">
      <h2>All Users</h2>
      <div id="users-list" class="admin-card">
        <!-- Populated via JS -->
      </div>
    </div>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
